<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Supervisor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="has-tabbar">
<div id="err" class="empty hidden"><div class="empty-ic" data-icon="linkoff"></div><h1></h1><p></p></div>
<div id="app" class="hidden">
  <header class="top frost"><div class="inner">
    <div class="top-txt">
      <h1 class="ltitle" id="room"></h1>
      <p class="sub" id="who"></p>
      <span class="pill ok" id="sync"></span>
    </div>
    <div class="ringcol">
      <div class="ringbox" id="ring"><span data-ring></span><b id="cnt">0</b></div>
      <div class="ringcap" id="cntOf"></div>
    </div>
  </div></header>
  <main class="wrap">
    <section id="tab-scan" class="tab">
      <div class="cam" id="cam">
        <div id="reader"></div>
        <div class="cam-idle"><span data-icon="camera"></span><p id="camHint"></p></div>
        <div class="vf"><i></i><i></i><i></i><i></i></div>
        <div class="flash" id="flash"><span data-icon="check"></span></div>
        <button class="btn cam-btn" id="bScan"></button>
      </div>
      <p id="camErr" class="note bad hidden" style="margin-top:12px"></p>
      <form id="manualPanel" class="group manual" autocomplete="off">
        <label for="idIn" id="idLabel"></label>
        <div class="fr">
          <input class="field idf" id="idIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="9" autocomplete="off" placeholder="000000000">
          <button class="btn primary" type="submit" id="bGo"></button>
        </div>
        <p id="idErr" class="err hidden"></p>
      </form>
      <h2 class="gh" id="recentH"></h2>
      <ul class="group" id="recent"></ul>
    </section>
    <section id="tab-list" class="tab hidden">
      <div class="search" style="margin-top:8px"><span data-icon="search"></span><input class="field" id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="seg" id="flt" style="margin-top:12px">
        <button data-v="all"></button><button data-v="missing"></button><button data-v="done"></button>
      </div>
      <ul class="group" id="roster" style="margin-top:14px"></ul>
      <h2 class="gh hidden" id="othersH"></h2>
      <ul class="group hidden" id="others"></ul>
    </section>
    <section id="tab-qr" class="tab hidden">
      <p class="qrhelp" id="qrHelp"></p>
      <div class="qrcard"><div id="qrBox" data-checkin-url=""></div></div>
      <div class="group qroff hidden" id="qrOff"><span data-icon="linkoff"></span><p id="qrMsg"></p></div>
      <div class="qrcount"><div class="ringbox" id="qrRing"><span data-ring></span></div><span id="qrCount"></span></div>
    </section>
  </main>
  <nav class="tabbar frost"><div class="seg" id="tabs">
    <button data-v="scan"><span data-icon="camera"></span><span id="tScan"></span></button>
    <button data-v="list"><span data-icon="list"></span><span id="tList"></span></button>
    <button data-v="qr"><span data-icon="qr"></span><span id="tQr"></span></button>
  </div></nav>
</div>
<script src="config.js"></script>
<script src="vendor/html5-qrcode-2.3.8.min.js"></script>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script src="js/ui.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n-es.js"></script>
<script src="js/api.js"></script>
<script src="js/outbox.js"></script>
<script src="js/scanner.js"></script>
<script src="js/supervisor.js"></script>
</body>
</html>
