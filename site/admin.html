<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TestRegister admin</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="admin">
<header class="top frost"><div class="inner">
  <div class="brand"><span class="dot" data-icon="check"></span>TestRegister</div>
  <div class="keybox">
    <span class="mockbadge hidden" id="mode">Mock backend</span>
    <div class="keyin"><input class="field" type="password" id="key" placeholder="Admin key" autocomplete="off" aria-label="Admin key"><button type="button" id="eye" aria-label="Show admin key"></button></div>
  </div>
</div></header>
<main class="wrap">
  <div class="seg" id="tabs"><button data-v="setup">Setup</button><button data-v="links">Links</button><button data-v="dash">Dashboard</button></div>

  <section id="sec-setup">
    <h2 class="sec">Upload data</h2>
    <div class="drops">
      <label class="drop" id="dz1"><input type="file" id="fStudents" accept=".csv,text/csv"><span data-icon="upload"></span><b class="dn">Students CSV</b><small class="dm">assigned_classrooms.csv: drop here or click</small></label>
      <label class="drop" id="dz2"><input type="file" id="fSups" accept=".csv,text/csv"><span data-icon="upload"></span><b class="dn">Supervisors CSV</b><small class="dm">assigned_supervisors.csv: drop here or click</small></label>
    </div>
    <div id="msgs"></div>
    <h2 class="sec hidden" id="roomsH">Classrooms</h2>
    <div class="group tablewrap hidden" id="roomsW"><table id="roomsT"><thead><tr><th>Classroom</th><th class="num">Students</th><th class="num">Expected</th><th>Supervisors</th></tr></thead><tbody></tbody></table></div>
    <div class="actions"><button class="btn primary" id="bSetup" disabled>Run setup</button></div>
  </section>

  <section id="sec-links" class="hidden">
    <div class="toolbar">
      <button class="btn primary" id="bLoad">Load supervisors</button>
      <div class="search"><span data-icon="search"></span><input class="field" id="lf" type="search" placeholder="Filter by name or classroom" autocomplete="off"></div>
      <button class="btn" id="bPrint" disabled><span data-icon="print"></span>Print sheet</button>
      <button class="btn" id="bEmail" disabled><span data-icon="mail"></span>Email links</button>
    </div>
    <div class="supgrid" id="supGrid"></div>
  </section>

  <section id="sec-dash" class="hidden">
    <div class="kpis" id="kpis"></div>
    <div class="dashbar">
      <button class="btn" id="bDash">Refresh</button>
      <label class="switch"><input type="checkbox" id="auto" checked role="switch">Auto-refresh</label>
      <button class="btn" id="bCsv"><span data-icon="download"></span>Download CSV</button>
      <span class="upd" id="upd"></span>
    </div>
    <h2 class="sec">Find a student</h2>
    <div class="search"><span data-icon="search"></span><input class="field" id="sq" type="search" placeholder="Name or ID" autocomplete="off"></div>
    <div class="group hidden" id="sres" style="margin-top:12px"></div>
    <div class="dashbar" style="margin-bottom:12px"><h2 class="sec" style="margin:0">Classrooms</h2>
      <div class="seg" id="sort" style="margin-left:auto;min-width:280px"><button data-v="name">Name</button><button data-v="pct">Progress</button><button data-v="absent">Absent</button></div></div>
    <div class="group" id="clist"></div>
  </section>
</main>
<div id="print"></div>
<script src="config.js"></script>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script src="js/ui.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n-es.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
