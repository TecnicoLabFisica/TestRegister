<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Registro de asistencia</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="center">
  <div class="card">
    <h1 id="title"></h1>
    <span class="roompill" id="room"></span>
    <form id="form" autocomplete="off">
      <div><label for="idIn" id="lbl"></label>
      <input class="field idf" id="idIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="9" autocomplete="off" placeholder="000000000"></div>
      <button class="btn primary block" type="submit" id="go"></button>
    </form>
    <div id="result" class="state hidden" role="status" aria-live="polite"></div>
    <button class="btn gray block hidden" id="again"></button>
  </div>
</main>
<script src="config.js"></script>
<script src="js/ui.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n-es.js"></script>
<script src="js/api.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
