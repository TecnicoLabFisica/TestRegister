<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Registro de asistencia a exámenes</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="center">
  <div class="hero">
    <div class="mark" data-icon="check"></div>
    <h1 id="t"></h1>
    <p id="lead"></p>
  </div>
  <div class="group tiles" id="tiles"></div>
  <p class="hint" id="hint"></p>
  <p class="foot"><a id="adm" href="admin.html"></a></p>
</main>
<script src="js/ui.js"></script>
<script src="js/i18n-es.js"></script>
<script>
  var I = ES.index, $ = function (id) { return document.getElementById(id); };
  $('t').textContent = I.title; $('lead').textContent = I.lead;
  $('hint').textContent = I.hint; $('adm').textContent = I.admin;
  I.tiles.forEach(function (t) {
    var d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = '<span class="ti">' + UI.icon(t.icon) + '</span><div class="tx"><b></b><span></span></div>';
    d.querySelector('b').textContent = t.t; d.querySelector('.tx span').textContent = t.d;
    $('tiles').appendChild(d);
  });
</script>
</body>
</html>
